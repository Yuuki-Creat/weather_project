<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>天気アプリ</title>
        <link 
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <div class="container mt-5">
            <div class="card shadow-lg p-4 rounded">
                <h1 class="text-center mb-4">天気予報アプリ</h1>
                <form id="weatherForm">
                    <div class="input-group mb-3">
                        <input type="text" id="cityInput" class="form-control" placeholder="都市名を入力">
                        <button class="btn btn-primary" type="submit">天気を取得</button>
                    </div>
                </form>
                <div id="loading" class="text-center d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...></span>
                    </div>
                </div>
                <div id="weatherResult" class="text-center mt-4"></div>
            </div>
        </div>
        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
